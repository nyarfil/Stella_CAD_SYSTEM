[project]
name = "ai-cad"
version = "0.1.0"
description = "AI-CAD: Claude Code as orchestrator + a bash-callable deterministic CadQuery tool layer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cadquery>=2.6.1",
    "cairosvg>=2.8.2",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pydoc-markdown>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
