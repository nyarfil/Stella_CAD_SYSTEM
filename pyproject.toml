[project]
name = "stella-cad"
version = "0.1.0"
description = "Windows AgentCAD for Cursor and Codex: confined kernel, HTTP bridge, MCP."
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stella_cad"]

[project.scripts]
stella-cad = "stella_cad.bridge:main"
