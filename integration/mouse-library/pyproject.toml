[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-library-mcp"
version = "0.1.4"
description = "Read-only, source-grounded computer mouse design knowledge MCP"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["mouse_library"]

[tool.setuptools.package-data]
mouse_library = ["data/*.json"]
