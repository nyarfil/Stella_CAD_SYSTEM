<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stella CAD Viewer</title>
<link rel="stylesheet" href="/vendor/three-cad-viewer/three-cad-viewer.css">
<style>
html,body{margin:0;height:100%;background:#1b1d21;color:#ddd;font:14px system-ui,sans-serif}
#side{position:fixed;left:0;top:0;bottom:0;width:240px;overflow:auto;background:#23262b;padding:8px;box-sizing:border-box}
#side a{color:#9fd;display:block;margin-bottom:8px}
#side div.f{padding:5px 6px;cursor:pointer;border-radius:4px;word-break:break-all}
#side div.f:hover,#side div.f.on{background:#3a4150}
#cad{position:fixed;left:240px;right:0;top:0;bottom:0}
#msg{position:fixed;right:12px;bottom:8px;color:#9fd;font-size:12px}
@media(max-width:700px){#side{position:static;width:auto;max-height:25%}#cad{left:0;top:25%}}
</style></head><body>
<div id="side"><a href="/static/index.html">メッシュ表示 (STL等)</a><div id="list"></div></div>
<div id="cad"></div><div id="msg"></div>
<script type="module" src="/static/cad.js"></script>
</body></html>
